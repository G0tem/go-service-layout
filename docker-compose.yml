services:
  app:
    container_name: app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks:
      - go-service-layout-network

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes:
      - layout-postgres-db_data:/var/lib/postgresql/data
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - go-service-layout-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@gmail.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
      PGADMIN_LISTEN_PORT: 5433
    ports:
      - "5433:5433"
    volumes:
      - layout-pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - go-service-layout-network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports: ["6379:6379"]
    volumes:
      - layout-redis-server_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - go-service-layout-network

  redis-ui:
    container_name: redis-ui
    image: rediscommander/redis-commander:latest
    ports:
      - '8081:8081'
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - go-service-layout-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports: ["5672:5672", "15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - layout-broker_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - go-service-layout-network

  mongo-db:
    image: mongo:8-noble
    container_name: mongo-db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    ports:
      - "${MONGO_PORT}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })", "--quiet"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - layout-mongo-db_data:/data/db
    networks:
      - go-service-layout-network

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_USER}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_PASSWORD}
      - ME_CONFIG_MONGODB_SERVER=${MONGO_HOST}
      - ME_CONFIG_MONGODB_PORT=${MONGO_PORT}
      - ME_CONFIG_MONGODB_AUTH_DATABASE=admin
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USER}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASSWORD}
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST}:${MONGO_PORT}/admin
    ports:
      - "8082:8082"
    depends_on:
      mongo-db:
        condition: service_healthy
    networks:
      - go-service-layout-network

  tempo:
    image: grafana/tempo:latest  # grafana/tempo:2.6.1
    container_name: tempo
    command: [ "-config.file=/etc/tempo.yaml" ]  # без -target= для single-binary
    user: "root"
    volumes:
      - ./grafana/tempo.yaml:/etc/tempo.yaml
      - layout-tempo_data:/tmp/tempo
    ports:
      - '3200:3200'  # HTTP API / ready endpoint
      - '4317:4317'  # OTLP gRPC
      - '4318:4318'  # OTLP HTTP
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - go-service-layout-network
    depends_on:
      - prometheus

  # jaeger:
  #   image: jaegertracing/all-in-one:latest
  #   container_name: jaeger
  #   ports:
  #     - "16686:16686"  # UI
  #     - "4317:4317"    # OTLP gRPC
  #     - "4318:4318"    # OTLP HTTP
  #   environment:
  #     - COLLECTOR_OTLP_ENABLED=true
  #   healthcheck:
  #     test: ["CMD", "wget", "--spider", "http://localhost:16686"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 5
  #   networks:
  #     - go-service-layout-network

  prometheus:
    image: prom/prometheus:latest
    command:
      # - "--config.file=/etc/prometheus/prometheus.yml"
      # - "--storage.tsdb.path=/prometheus" 
      # - "--web.external-url=http://127.0.0.1:9090"
      # - "--web.console.libraries=/usr/share/prometheus/console_libraries" 
      # - "--web.console.templates=/usr/share/prometheus/consoles"
      - --config.file=/etc/prometheus.yaml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./grafana/prometheus.yaml:/etc/prometheus.yaml
    ports:
      - '9090:9090'
    networks:
      - go-service-layout-network

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor,traceQLStreaming,metricsSummary
    ports:
      - '3000:3000'
    depends_on:
      - prometheus
      - tempo
    networks:
      - go-service-layout-network

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    command: ["--config.file=/etc/loki/config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./grafana/loki.yaml:/etc/loki/config.yaml
      - layout-loki_data:/loki
    networks:
      - go-service-layout-network

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - '9092:9092'  # INTERNAL — для других контейнеров
      - '9094:9094'  # EXTERNAL — для хоста
    environment:
      # KRaft mode settings
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: '0@kafka:9093'
      
      # Listeners: используем ИМЕНА (INTERNAL, EXTERNAL)
      KAFKA_LISTENERS: 'INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:9092,EXTERNAL://kafka:9094'
      
      # Маппинг: каждое имя - протокол
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT'
      
      # Контроллер и межброкерское общение
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      
      # Прочее
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - layout-kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "kafka:9092"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s
    networks:
      - go-service-layout-network

  kafka-init:
    image: apache/kafka:4.0.0
    container_name: kafka-init
    command: >
      bash -c "
        echo 'Waiting for Kafka...';
        until kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1; do
          echo 'Kafka not ready, waiting...';
          sleep 2;
        done;
        echo 'Creating topic apple-topic...';
        kafka-topics.sh --create --if-not-exists --bootstrap-server kafka:9092 --topic apple-topic --partitions 1 --replication-factor 1;
        echo 'Done.'
      "
    depends_on:
      kafka:
        condition: service_healthy
    restart: 'on-failure'
    networks:
      - go-service-layout-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - '8383:8080'
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - go-service-layout-network

volumes:
  layout-postgres-db_data:
  layout-redis-server_data:
  layout-broker_data:
  layout-mongo-db_data:
  layout-pgadmin_data:
  layout-kafka_data:
  layout-loki_data:
  layout-tempo_data:

networks:
  go-service-layout-network:
    driver: bridge
    name: go-service-layout-network